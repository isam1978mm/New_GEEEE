name: Allen Harbor cap recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_allen_harbor_cap_records.py"
      - "scripts/recover_allen_harbor_cap_records_fast.py"
      - ".github/workflows/allen-harbor-cap-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recover focused official Allen Harbor records
        run: python scripts/recover_allen_harbor_cap_records_fast.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allen-harbor-cap-records
          path: artifacts/allen_harbor_cap_records/
          if-no-files-found: warn
          retention-days: 7
