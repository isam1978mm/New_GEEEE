name: Allen Harbor cap recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_allen_harbor_cap_records.py"
      - "scripts/recover_allen_harbor_cap_records_fast.py"
      - "scripts/recover_allen_harbor_collection_records.py"
      - "scripts/inventory_allen_harbor_collection.py"
      - ".github/workflows/allen-harbor-cap-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Inventory decisive Allen Harbor EPA records
        run: python scripts/inventory_allen_harbor_collection.py
      - name: Upload evidence inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allen-harbor-collection-inventory
          path: artifacts/allen_harbor_collection_inventory/
          if-no-files-found: warn
          retention-days: 7
