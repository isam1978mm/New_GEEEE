name: Area B 1993 closure recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_area_b_1993_closure.py"
      - ".github/workflows/area-b-1993-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Search and recover Area B closure records
        run: python scripts/recover_area_b_1993_closure.py
      - name: Upload Area B evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area-b-1993-closure
          path: artifacts/area_b_1993_closure/
          if-no-files-found: warn
          retention-days: 7
