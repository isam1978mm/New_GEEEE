name: Bremo closure survey extractor

on:
  pull_request:
    paths:
      - "scripts/extract_bremo_closure_surveys.py"
      - ".github/workflows/bremo-closure-survey-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-surveys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pillow

      - name: Download official Virginia DEQ reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bremo_source artifacts/bremo_closure_surveys
          : > artifacts/bremo_closure_surveys/download.log
          names=(east_part1 east_part2 east_part3 west_part1 west_part2 acceptance_memo)
          urls=(
            'https://www.deq.virginia.gov/home/showpublisheddocument/28240/638784924197370000'
            'https://www.deq.virginia.gov/home/showpublisheddocument/28316/638785956531600000'
            'https://www.deq.virginia.gov/home/showpublisheddocument/28241/638784924199130000'
            'https://www.deq.virginia.gov/home/showpublisheddocument/28244/638784924204170000'
            'https://www.deq.virginia.gov/home/showpublisheddocument/28243/638784924202470000'
            'https://www.deq.virginia.gov/home/showpublisheddocument/28245/638784924205800000'
          )
          success=0
          for i in "${!urls[@]}"; do
            name="${names[$i]}"
            output="/tmp/bremo_source/${name}.pdf"
            echo "Downloading ${name}" | tee -a artifacts/bremo_closure_surveys/download.log
            if curl --location --fail --show-error --silent \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 \
              --user-agent 'Mozilla/5.0 (compatible; evidence-recovery/1.0)' \
              --referer 'https://www.deq.virginia.gov/news-info/shortcuts/permits/waste/coal-ash/bremo-bluff' \
              "${urls[$i]}" --output "$output" \
              2>> artifacts/bremo_closure_surveys/download.log; then
              bytes=$(stat -c%s "$output")
              mime=$(file -b --mime-type "$output")
              echo "name=${name} bytes=${bytes} mime=${mime}" | tee -a artifacts/bremo_closure_surveys/download.log
              if [ "$bytes" -ge 10000 ] && [ "$mime" = 'application/pdf' ]; then
                success=$((success + 1))
              else
                rm -f "$output"
                echo "name=${name} rejected" | tee -a artifacts/bremo_closure_surveys/download.log
              fi
            else
              echo "name=${name} download failed" | tee -a artifacts/bremo_closure_surveys/download.log
            fi
          done
          echo "valid_pdf_count=${success}" | tee -a artifacts/bremo_closure_surveys/download.log
          if [ "$success" -eq 0 ]; then
            exit 1
          fi

      - name: Extract survey and acceptance pages
        shell: bash
        run: |
          set -o pipefail
          BREMO_SOURCE_DIR=/tmp/bremo_source \
            python scripts/extract_bremo_closure_surveys.py \
            2>&1 | tee artifacts/bremo_closure_surveys/extractor.log

      - name: Remove source PDFs
        if: always()
        run: rm -rf /tmp/bremo_source

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bremo-closure-surveys
          path: artifacts/bremo_closure_surveys/
          if-no-files-found: warn
          retention-days: 7
