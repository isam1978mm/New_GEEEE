name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused safety tests
        run: pytest tests/unit/test_no_ee_authenticate.py tests/unit/test_forbidden_terms.py -v

      - name: Run full test suite
        run: pytest tests/unit/ tests/integration/ tests/notebook_parity/

      - name: Check for forbidden ee.Authenticate usage
        run: python scripts/check_no_ee_authenticate.py

      - name: Check for direct file streaming
        run: python scripts/check_no_direct_streaming.py

      - name: Check notebook safety
        shell: bash
        run: |
          if [ -f scripts/check_notebook_safety.py ]; then
            python scripts/check_notebook_safety.py
          fi
