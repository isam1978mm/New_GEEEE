name: Consolidated Iron full SEMS search

on:
  pull_request:
    paths:
      - "scripts/discover_consolidated_iron_sems_collections.py"
      - ".github/workflows/consolidated-iron-sems-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-collections:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install search dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Search full EPA SEMS collections
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/consolidated_iron_sems_search
          python scripts/discover_consolidated_iron_sems_collections.py \
            2>&1 | tee artifacts/consolidated_iron_sems_search/search.log

      - name: Upload search artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-iron-sems-search
          path: artifacts/consolidated_iron_sems_search/
          if-no-files-found: warn
          retention-days: 7
