name: Hoosier #1 VFC fast recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_hoosier1_vfc_fast.py"
      - ".github/workflows/hoosier1-vfc-fast-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-fast-records:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Recover Hoosier #1 closure records
        run: python scripts/recover_hoosier1_vfc_fast.py
      - name: Upload fast evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoosier1-vfc-fast-records
          path: artifacts/hoosier1_vfc_fast/
          if-no-files-found: warn
          retention-days: 7

# Temporary public-record recovery tooling; do not merge.
