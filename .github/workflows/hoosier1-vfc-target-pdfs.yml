name: Hoosier #1 VFC target PDFs

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_hoosier1_vfc_target_pdfs.py"
      - ".github/workflows/hoosier1-vfc-target-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-target-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Recover target-window PDFs
        run: python scripts/recover_hoosier1_vfc_target_pdfs.py
      - name: Upload target PDF package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoosier1-vfc-target-pdfs
          path: artifacts/hoosier1_vfc_target_pdfs/
          if-no-files-found: warn
          retention-days: 7

