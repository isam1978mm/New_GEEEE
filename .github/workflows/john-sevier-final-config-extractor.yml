name: John Sevier final configuration extractor

on:
  pull_request:
    paths:
      - "scripts/extract_john_sevier_final_configuration.py"
      - ".github/workflows/john-sevier-final-config-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-final-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf requests pillow

      - name: Download and extract relevant map pages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/john_sevier_final_configuration
          PDF_URL='https://www.tva.com/docs/default-source/ccr/jsf/surface-impoundment---bottom-ash-pond/design-criteria/history-of-construction/257-73%28c%29-_history-of-construction_jsf_bottom-ash-pond.pdf?sfvrsn=703326f1_2'
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (compatible; evidence-recovery/1.0)' \
            --referer 'https://www.tva.com/' \
            "$PDF_URL" \
            --output /tmp/john_sevier_history_of_construction.pdf \
            2>&1 | tee artifacts/john_sevier_final_configuration/download.log
          ls -lh /tmp/john_sevier_history_of_construction.pdf | tee -a artifacts/john_sevier_final_configuration/download.log
          JOHN_SEVIER_SOURCE_PDF=/tmp/john_sevier_history_of_construction.pdf \
            python scripts/extract_john_sevier_final_configuration.py \
            2>&1 | tee artifacts/john_sevier_final_configuration/extractor.log

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-sevier-final-configuration
          path: artifacts/john_sevier_final_configuration/
          if-no-files-found: warn
          retention-days: 7
