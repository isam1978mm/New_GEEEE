name: John Sevier final configuration extractor

on:
  pull_request:
    paths:
      - "scripts/extract_john_sevier_final_configuration.py"
      - ".github/workflows/john-sevier-final-config-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-final-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf requests pillow

      - name: Download and extract relevant map pages
        run: python scripts/extract_john_sevier_final_configuration.py

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-sevier-final-configuration
          path: artifacts/john_sevier_final_configuration/
          if-no-files-found: warn
          retention-days: 7
