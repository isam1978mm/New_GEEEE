name: John Sevier history recovery 20260729

on:
  push:
    branches:
      - agent/john-sevier-history-recovery-20260729
    paths:
      - .github/workflows/john-sevier-history-recovery-20260729.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/john-sevier-history-recovery-20260729.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 poppler-utils qpdf

      - name: Download official TVA History of Construction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/rendered
          URL='https://www.tva.com/docs/default-source/ccr/jsf/surface-impoundment---bottom-ash-pond/design-criteria/history-of-construction/257-73%28c%29-_history-of-construction_jsf_bottom-ash-pond.pdf?sfvrsn=703326f1_2'
          aria2c \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=2M \
            --timeout=60 \
            --connect-timeout=30 \
            --retry-wait=5 \
            --max-tries=20 \
            --file-allocation=none \
            --user-agent='Mozilla/5.0 Chrome/126 Safari/537.36' \
            --referer='https://www.tva.com/' \
            --dir=recovered \
            --out=john_sevier_history_of_construction.pdf \
            "$URL"
          test "$(head -c 4 recovered/john_sevier_history_of_construction.pdf)" = '%PDF'
          test "$(stat -c%s recovered/john_sevier_history_of_construction.pdf)" -gt 50000000
          qpdf --check recovered/john_sevier_history_of_construction.pdf

      - name: Extract searchable evidence
        shell: bash
        run: |
          set -euo pipefail
          PDF=recovered/john_sevier_history_of_construction.pdf
          pdfinfo "$PDF" > recovered/pdfinfo.txt
          pdftotext -layout "$PDF" recovered/john_sevier_history_of_construction.txt || true
          grep -niE -C 4 'final cover|cover thickness|soil cover|vegetat|topsoil|as-built|as built|survey|closure|cap|depth|thickness|cross.section|configuration|drawing|elevation|grade|uncert|tolerance' \
            recovered/john_sevier_history_of_construction.txt > recovered/key_hits.txt || true
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          LAST=$(( PAGES < 60 ? PAGES : 60 ))
          pdftoppm -f 1 -l "$LAST" -jpeg -r 75 -jpegopt quality=70 "$PDF" recovered/rendered/page >/dev/null 2>&1
          {
            sha256sum "$PDF"
            stat -c 'bytes=%s' "$PDF"
            echo "rendered_pages=1-${LAST}"
          } > recovered/INVENTORY.txt

      - name: Upload recovered records
        uses: actions/upload-artifact@v4
        with:
          name: john-sevier-history-records-20260729
          path: recovered/
          if-no-files-found: error
          retention-days: 7
