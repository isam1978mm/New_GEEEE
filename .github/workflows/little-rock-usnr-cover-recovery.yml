name: Little Rock USNR cover recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_little_rock_usnr_cover_records.py"
      - ".github/workflows/little-rock-usnr-cover-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests
      - name: Recover official Little Rock USNR records
        run: python scripts/recover_little_rock_usnr_cover_records.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-rock-usnr-cover-records
          path: artifacts/little_rock_usnr_cover_records/
          if-no-files-found: warn
          retention-days: 7
