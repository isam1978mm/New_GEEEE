name: McMaster as-built pixel screen

on:
  pull_request:
    paths:
      - "scripts/extract_mcmaster_asbuilt_cover_drawings.py"
      - ".github/workflows/mcmaster-asbuilt-pixel-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-asbuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pillow

      - name: Download official NYSDEC Appendices A-G
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mcmaster_asbuilt_cover_drawings
          url='https://extapps.dec.ny.gov/data/DecDocs/706010/Report.HW.706010.2019-07-30.Construction%20Completion%20Report%20Appendices%20A%20thru%20G.pdf'
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (compatible; environmental-evidence-recovery/1.0)' \
            "$url" --output /tmp/mcmaster_appendices_a_g.pdf \
            2>&1 | tee artifacts/mcmaster_asbuilt_cover_drawings/download.log
          file /tmp/mcmaster_appendices_a_g.pdf | tee -a artifacts/mcmaster_asbuilt_cover_drawings/download.log
          bytes=$(stat -c%s /tmp/mcmaster_appendices_a_g.pdf)
          mime=$(file -b --mime-type /tmp/mcmaster_appendices_a_g.pdf)
          if [ "$bytes" -lt 10000000 ] || [ "$mime" != 'application/pdf' ]; then
            echo "Invalid PDF: bytes=$bytes mime=$mime"
            exit 1
          fi

      - name: Extract Appendix A as-built drawings
        shell: bash
        run: |
          set -o pipefail
          MCMASTER_APPENDICES_PDF=/tmp/mcmaster_appendices_a_g.pdf \
            python scripts/extract_mcmaster_asbuilt_cover_drawings.py \
            2>&1 | tee artifacts/mcmaster_asbuilt_cover_drawings/extractor.log

      - name: Remove source PDF
        if: always()
        run: rm -f /tmp/mcmaster_appendices_a_g.pdf

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcmaster-asbuilt-cover-drawings
          path: artifacts/mcmaster_asbuilt_cover_drawings/
          if-no-files-found: warn
          retention-days: 7
