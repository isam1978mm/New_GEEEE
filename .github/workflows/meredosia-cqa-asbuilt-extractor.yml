name: Meredosia CQA as-built extractor

on:
  pull_request:
    paths:
      - "scripts/extract_meredosia_cqa_asbuilt.py"
      - ".github/workflows/meredosia-cqa-asbuilt-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-cqa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pillow requests beautifulsoup4

      - name: Discover and extract public CQA report
        run: python scripts/extract_meredosia_cqa_asbuilt.py

      - name: Remove source PDF
        if: always()
        run: rm -f /tmp/meredosia_cqa.pdf

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meredosia-cqa-asbuilt
          path: artifacts/meredosia_cqa_asbuilt/
          if-no-files-found: warn
          retention-days: 7
