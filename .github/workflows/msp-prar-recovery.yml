name: Middlesex Sampling PRAR recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_middlesex_sampling_prar.py"
      - ".github/workflows/msp-prar-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests
      - name: Recover official Middlesex Sampling Plant PRAR
        run: python scripts/recover_middlesex_sampling_prar.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: middlesex-sampling-prar-records
          path: artifacts/middlesex_sampling_prar/
          if-no-files-found: warn
          retention-days: 7
