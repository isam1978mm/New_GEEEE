name: NAS Alameda Site 2 cap recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_nas_alameda_site2_cap_records.py"
      - ".github/workflows/nas-alameda-site2-cap-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recover official NAS Alameda records
        run: python scripts/recover_nas_alameda_site2_cap_records.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nas-alameda-site2-cap-records
          path: artifacts/nas_alameda_site2_cap_records/
          if-no-files-found: warn
          retention-days: 7
