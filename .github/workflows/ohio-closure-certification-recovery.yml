name: Ohio closure certification recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_ohio_closure_certifications.py"
      - ".github/workflows/ohio-closure-certification-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Recover shortlisted closure certifications
        run: python scripts/recover_ohio_closure_certifications.py
      - name: Upload recovered reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohio-closure-certifications
          path: artifacts/ohio_closure_certifications/
          if-no-files-found: warn
          retention-days: 7
