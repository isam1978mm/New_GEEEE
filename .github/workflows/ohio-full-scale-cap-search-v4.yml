name: Ohio restricted cap certification inventory v4

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/scout_ohio_full_scale_cap_records_v3.py"
      - "scripts/scout_ohio_full_scale_cap_records_v4.py"
      - ".github/workflows/ohio-full-scale-cap-search-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-records:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Enumerate restricted landfill cap records
        run: python scripts/scout_ohio_full_scale_cap_records_v4.py
      - name: Upload restricted inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohio-restricted-cap-certification-inventory-v4
          path: artifacts/ohio_full_scale_cap_records_v3/
          if-no-files-found: warn
          retention-days: 7
