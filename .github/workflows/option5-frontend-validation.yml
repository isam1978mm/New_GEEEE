name: Option 5 frontend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend-v2/src/**"
      - "frontend-v2/package.json"
      - "frontend-v2/package-lock.json"
      - "tests/unit/test_option5_anomaly_ui_contract.py"
      - ".github/workflows/option5-frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci
      - name: Build production SPA
        working-directory: frontend-v2
        run: npm run build
      - name: Upload generated SPA for review
        uses: actions/upload-artifact@v4
        with:
          name: option5-frontend-dist
          path: frontend-v2/dist/
          if-no-files-found: error
          retention-days: 7
