name: Plant Kraft AP-1 map extractor

on:
  pull_request:
    paths:
      - "scripts/extract_plant_kraft_ap1_maps.py"
      - "scripts/georeference_plant_kraft_ap1.py"
      - ".github/workflows/plant-kraft-ap1-map-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pillow requests numpy opencv-python-headless

      - name: Download official Certification of CCR Removal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/plant_kraft_ap1_maps artifacts/plant_kraft_ap1_georeference
          url='https://www.georgiapower.com/content/dam/georgia-power/pdfs/company-pdfs/plant-kraft/f_cert-of-ccr-removal.pdf'
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1200 \
            --user-agent 'Mozilla/5.0 (compatible; evidence-recovery/1.0)' \
            --referer 'https://www.georgiapower.com/our-impact/environment/environmental-compliance/plant-list/plant-kraft.html' \
            "$url" --output /tmp/plant_kraft_ccr_removal.pdf \
            2>&1 | tee artifacts/plant_kraft_ap1_maps/download.log
          file /tmp/plant_kraft_ccr_removal.pdf | tee -a artifacts/plant_kraft_ap1_maps/download.log
          bytes=$(stat -c%s /tmp/plant_kraft_ccr_removal.pdf)
          mime=$(file -b --mime-type /tmp/plant_kraft_ccr_removal.pdf)
          if [ "$bytes" -lt 10000 ] || [ "$mime" != 'application/pdf' ]; then
            echo "Downloaded file failed validation: bytes=${bytes} mime=${mime}" | tee -a artifacts/plant_kraft_ap1_maps/download.log
            exit 1
          fi

      - name: Extract engineering-map pages
        shell: bash
        run: |
          set -o pipefail
          PLANT_KRAFT_SOURCE_PDF=/tmp/plant_kraft_ccr_removal.pdf \
            python scripts/extract_plant_kraft_ap1_maps.py \
            2>&1 | tee artifacts/plant_kraft_ap1_maps/extractor.log

      - name: Independently georeference Figure 3 to USGS NAIP
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PLANT_KRAFT_SOURCE_PDF=/tmp/plant_kraft_ccr_removal.pdf \
            python scripts/georeference_plant_kraft_ap1.py \
            2>&1 | tee artifacts/plant_kraft_ap1_georeference/georeference.log

      - name: Remove source PDF
        if: always()
        run: rm -f /tmp/plant_kraft_ccr_removal.pdf

      - name: Upload map and georeference artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-kraft-ap1-maps
          path: |
            artifacts/plant_kraft_ap1_maps/
            artifacts/plant_kraft_ap1_georeference/
          if-no-files-found: warn
          retention-days: 7
