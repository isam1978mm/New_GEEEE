name: Plattsburgh landfill pair recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_plattsburgh_landfill_pair.py"
      - ".github/workflows/plattsburgh-landfill-pair-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Recover official Plattsburgh records
        run: python scripts/recover_plattsburgh_landfill_pair.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plattsburgh-landfill-pair
          path: artifacts/plattsburgh_landfill_pair/
          if-no-files-found: warn
          retention-days: 7
