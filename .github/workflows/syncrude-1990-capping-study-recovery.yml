name: Syncrude 1990 capping-study recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_syncrude_1990_capping_study.py"
      - ".github/workflows/syncrude-1990-capping-study-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests
      - name: Recover primary Syncrude capping report
        run: python scripts/recover_syncrude_1990_capping_study.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncrude-1990-capping-study-records
          path: artifacts/syncrude_1990_capping_study/
          if-no-files-found: warn
          retention-days: 7
