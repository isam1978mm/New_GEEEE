name: Syncrude soil-reconstruction recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_syncrude_soil_reconstruction_report.py"
      - ".github/workflows/syncrude-soil-reconstruction-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests
      - name: Recover primary Syncrude soil-reconstruction report
        run: python scripts/recover_syncrude_soil_reconstruction_report.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncrude-soil-reconstruction-records
          path: artifacts/syncrude_soil_reconstruction_report/
          if-no-files-found: warn
          retention-days: 7
