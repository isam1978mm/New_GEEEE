name: Tangerine live lidar execution

on:
  pull_request:
    paths:
      - ".github/workflows/tangerine-live-execution.yml"
  workflow_dispatch:

jobs:
  execute-tangerine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up geospatial analysis environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tangerine
          create-args: >-
            python=3.11
            pdal
            numpy
            rasterio
            pyproj
          init-shell: bash
          cache-environment: true

      - name: Prepare target and analysis bounds
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          python scripts/tangerine_lidar_execution.py prepare \
            --output-dir data/research/tangerine_live

      - name: Discover official USGS DEM products intersecting Tangerine
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from pyproj import Transformer

          out = Path("data/research/tangerine_live")
          prep = json.loads((out / "prepare_summary.json").read_text())
          xmin, ymin, xmax, ymax = prep["analysis_bounds_utm12n"]
          tr = Transformer.from_crs("EPSG:32612", "EPSG:4326", always_xy=True)
          west, south = tr.transform(xmin, ymin)
          east, north = tr.transform(xmax, ymax)
          bbox = (west, south, east, north)
          print("TANGERINE_WGS84_BBOX=", bbox)

          discovery = {"bbox_wgs84": bbox, "tnm": [], "waf": {}}

          params = {
              "datasets": "Digital Elevation Model (DEM) 1 meter",
              "bbox": ",".join(f"{x:.8f}" for x in bbox),
              "max": "100",
              "outputFormat": "JSON",
          }
          api = "https://tnmaccess.nationalmap.gov/api/v1/products?" + urllib.parse.urlencode(params)
          try:
              with urllib.request.urlopen(api, timeout=60) as response:
                  payload = json.load(response)
              print("TNM_TOTAL=", payload.get("total"))
              for item in payload.get("items", []):
                  row = {k: item.get(k) for k in (
                      "title", "publicationDate", "lastUpdated", "downloadURL",
                      "sourceId", "sourceName", "format", "sizeInBytes"
                  )}
                  discovery["tnm"].append(row)
                  print("TNM_ITEM=", json.dumps(row, sort_keys=True))
          except Exception as exc:
              print("TNM_API_ERROR=", repr(exc))

          projects = {
              "pre_2015": "AZ_Eastern_PimaCO_2015",
              "post_2021": "AZ_PimaCo_2_2021",
          }
          base = "https://thor-f5.er.usgs.gov/ngtoc/metadata/waf/elevation/opr_dem/geotiff/"
          href_re = re.compile(r'href=[\"\']([^\"\']+)[\"\']', re.I)
          url_re = re.compile(r'https?://[^\s<>\"\']+', re.I)

          def first_float(xml, tag):
              m = re.search(fr"<{tag}[^>]*>\s*([-+0-9.eE]+)\s*</{tag}>", xml, re.I)
              return float(m.group(1)) if m else None

          def intersects(bb):
              w, s, e, n = bb
              return not (e < west or w > east or n < south or s > north)

          for label, project in projects.items():
              index_url = base + project + "/"
              try:
                  with urllib.request.urlopen(index_url, timeout=60) as response:
                      index = response.read().decode("utf-8", "replace")
              except Exception as exc:
                  print("WAF_INDEX_ERROR=", label, index_url, repr(exc))
                  discovery["waf"][label] = {"index_url": index_url, "error": repr(exc)}
                  continue
              hrefs = [html.unescape(x) for x in href_re.findall(index)]
              xml_hrefs = sorted({x for x in hrefs if ".xml" in x.lower()})
              print("WAF_XML_COUNT=", label, len(xml_hrefs), "INDEX=", index_url)
              hits = []
              for href in xml_hrefs:
                  meta_url = urllib.parse.urljoin(index_url, href)
                  try:
                      with urllib.request.urlopen(meta_url, timeout=30) as response:
                          xml = response.read().decode("utf-8", "replace")
                  except Exception as exc:
                      print("WAF_META_ERROR=", meta_url, repr(exc))
                      continue
                  w = first_float(xml, "westbc")
                  e = first_float(xml, "eastbc")
                  n = first_float(xml, "northbc")
                  s = first_float(xml, "southbc")
                  if None in (w, s, e, n) or not intersects((w, s, e, n)):
                      continue
                  urls = sorted({html.unescape(u).rstrip(".,;)'") for u in url_re.findall(xml)})
                  tif_urls = [u for u in urls if ".tif" in u.lower()]
                  hit = {
                      "metadata_url": meta_url,
                      "bbox": [w, s, e, n],
                      "tif_urls": tif_urls,
                      "all_urls": urls[:30],
                  }
                  hits.append(hit)
                  print("WAF_HIT=", label, json.dumps(hit, sort_keys=True))
              discovery["waf"][label] = {"index_url": index_url, "hits": hits}

          (out / "official_dem_discovery.json").write_text(json.dumps(discovery, indent=2, sort_keys=True))
          PY

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tangerine-live-result
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/research/tangerine_live/prepare_summary.json
            data/research/tangerine_live/tangerine_target.geojson
            data/research/tangerine_live/official_dem_discovery.json
