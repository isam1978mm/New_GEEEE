name: Tangerine live lidar execution

on:
  pull_request:
    paths:
      - ".github/workflows/tangerine-live-execution.yml"
  workflow_dispatch:

jobs:
  execute-tangerine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query official TNM products at Tangerine
        run: |
          set -euxo pipefail
          mkdir -p data/research/tangerine_live
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          bbox = (-111.20391848, 32.41001929, -111.17003061, 32.43513044)
          queries = [
              {"datasets": "Digital Elevation Model (DEM) 1 meter", "bbox": ",".join(map(str,bbox)), "max": "500", "outputFormat": "JSON"},
              {"q": "Eastern Pima", "bbox": ",".join(map(str,bbox)), "max": "500", "outputFormat": "JSON"},
              {"q": "PimaCo 2 2021", "bbox": ",".join(map(str,bbox)), "max": "500", "outputFormat": "JSON"},
          ]
          results = []
          for params in queries:
              url = "https://tnmaccess.nationalmap.gov/api/v1/products?" + urllib.parse.urlencode(params)
              print("QUERY_URL=", url, flush=True)
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      payload = json.load(response)
              except Exception as exc:
                  print("QUERY_ERROR=", repr(exc), flush=True)
                  results.append({"params": params, "error": repr(exc)})
                  continue
              print("TOTAL=", payload.get("total"), flush=True)
              rows = []
              for item in payload.get("items", []):
                  row = {k: item.get(k) for k in item.keys() if k in {
                      "title","publicationDate","lastUpdated","downloadURL","sourceId","sourceName",
                      "format","sizeInBytes","boundingBox","urls","metaUrl","datasets","extent"
                  }}
                  rows.append(row)
                  print("ITEM=", json.dumps(row, sort_keys=True), flush=True)
              results.append({"params": params, "total": payload.get("total"), "items": rows})
          Path("data/research/tangerine_live/tnm_products.json").write_text(json.dumps({"bbox":bbox,"queries":results},indent=2,sort_keys=True))
          PY

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tangerine-live-result
          if-no-files-found: warn
          retention-days: 30
          path: data/research/tangerine_live/tnm_products.json
