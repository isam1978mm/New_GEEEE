name: Tyrone 3X and No1 as-built recovery

on:
  push:
    branches:
      - agent/tyrone-3x-no1-asbuilt-recovery-20260729
    paths:
      - .github/workflows/tyrone-3x-no1-asbuilt-recovery.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tyrone-3x-no1-asbuilt-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Scrape official links and download records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/pdfs recovered/text
          python - <<'PY'
          import json, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          page_url = "https://www.emnrd.nm.gov/mmd/mining-act-reclamation-program/pending-and-approved-mine-applications/mining-applications-regular-existing/gr010retyrone-mine-revision-09-1/"
          wanted = {
              "Comprehensive Cover Performance Evaluation": "cover_performance",
              "3X Tailing Annual Summary": "3x_annual",
              "3X Tailing As-Built": "3x_asbuilt",
              "No. 1 Stockpile Annual Summary": "no1_annual",
              "No. 1 Stockpile As-Built": "no1_asbuilt",
          }
          later = [
              {"label": "2020 Closure Plan Text Figures Plates Tables", "slug": "2020_closure_plan", "url": "https://www.emnrd.nm.gov/mmd/wp-content/uploads/sites/5/2-18106417_004RRev1_Tyrone_CCP_Update_20200429.pdf"},
              {"label": "2020 Appendix A Reclamation Design Drawings", "slug": "2020_appendixA_drawings", "url": "https://www.emnrd.nm.gov/mmd/wp-content/uploads/sites/5/3-AppendixA_ReclamationDesignDrawings_Rev1.pdf"},
              {"label": "2018 FMI Response to Updated CCP Comments", "slug": "2018_fmi_response", "url": "https://www.emnrd.nm.gov/mmd/wp-content/uploads/sites/5/2018-04-13FMIResponsetoCommentsUpdatedCCP_Tyrone_GR010RE.pdf"},
              {"label": "2008 FMI Responses to Primary Issues", "slug": "2008_fmi_responses", "url": "https://www.emnrd.nm.gov/mmd/wp-content/uploads/sites/5/2008-06-23_FMIResponsestoPrimaryIssuesTyroneUpdatedCCP.pdf"},
          ]
          out = Path("recovered")
          headers = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"}
          s = requests.Session()
          r = s.get(page_url, headers=headers, timeout=120)
          r.raise_for_status()
          (out / "page.html").write_bytes(r.content)
          soup = BeautifulSoup(r.text, "html.parser")

          found = []
          for a in soup.find_all("a", href=True):
              label = " ".join(a.get_text(" ", strip=True).split())
              if label in wanted:
                  found.append({"label": label, "slug": wanted[label], "url": urljoin(page_url, a["href"])})
          by_label = {x["label"]: x for x in found}
          missing = [label for label in wanted if label not in by_label]
          if missing:
              raise SystemExit(f"Missing official links: {missing}")
          records = [by_label[label] for label in wanted] + later
          (out / "LINKS.json").write_text(json.dumps(records, indent=2), encoding="utf-8")
          (out / "LINKS.txt").write_text("\n".join(f'{x["label"]}\t{x["url"]}' for x in records), encoding="utf-8")

          for i, item in enumerate(records, 1):
              path = out / "pdfs" / f'{i:02d}_{item["slug"]}.pdf'
              print(f'Downloading {item["label"]}: {item["url"]}')
              rr = s.get(item["url"], headers=headers, timeout=1200)
              rr.raise_for_status()
              path.write_bytes(rr.content)
              if rr.content[:4] != b"%PDF":
                  raise RuntimeError(f'Not PDF: {item["url"]}; type={rr.headers.get("content-type")}; bytes={len(rr.content)}')
              time.sleep(0.3)
          PY

      - name: Query official USGS mine-waste service near Tyrone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/usgs_nmwi
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          root = "https://energy.usgs.gov/arcgis/rest/services/Hosted/National_Mine_Waste_Inventory/FeatureServer"
          out = Path("recovered/usgs_nmwi")
          headers = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"}
          session = requests.Session()

          for layer in (0, 1):
              meta = session.get(f"{root}/{layer}", params={"f": "pjson"}, headers=headers, timeout=120)
              meta.raise_for_status()
              (out / f"layer_{layer}_metadata.json").write_bytes(meta.content)

              params = {
                  "where": "1=1",
                  "geometry": "-108.55,32.48,-108.15,32.88",
                  "geometryType": "esriGeometryEnvelope",
                  "inSR": "4326",
                  "spatialRel": "esriSpatialRelIntersects",
                  "outFields": "*",
                  "returnGeometry": "true",
                  "outSR": "4326",
                  "f": "geojson",
              }
              response = session.get(f"{root}/{layer}/query", params=params, headers=headers, timeout=300)
              response.raise_for_status()
              (out / f"layer_{layer}_near_tyrone.geojson").write_bytes(response.content)
              data = response.json()
              print(f"Layer {layer}: {len(data.get('features', []))} features near Tyrone")
              for feature in data.get("features", []):
                  props = feature.get("properties", {})
                  print(json.dumps({k: props.get(k) for k in ("site_id", "site_name", "ftr_id", "ftr_name", "ftr_type", "loc_descr", "area_sqkm", "remarks")}, ensure_ascii=False))

          text_params = {
              "where": "UPPER(site_name) LIKE '%TYRONE%' OR UPPER(ftr_name) LIKE '%TYRONE%' OR UPPER(loc_descr) LIKE '%TYRONE%'",
              "outFields": "*",
              "returnGeometry": "true",
              "outSR": "4326",
              "f": "geojson",
          }
          response = session.get(f"{root}/1/query", params=text_params, headers=headers, timeout=300)
          response.raise_for_status()
          (out / "polygons_text_match_tyrone.geojson").write_bytes(response.content)
          print("Text-match polygons:", len(response.json().get("features", [])))
          PY

      - name: Extract text and targeted evidence
        shell: bash
        run: |
          set -euo pipefail
          : > recovered/INVENTORY.txt
          : > recovered/TARGETED_EXTRACTS.txt
          for pdf in recovered/pdfs/*.pdf; do
            base="$(basename "${pdf%.pdf}")"
            txt="recovered/text/${base}.txt"
            pdftotext -layout "$pdf" "$txt"
            {
              echo "==== $(basename "$pdf") ===="
              sha256sum "$pdf"
              pdfinfo "$pdf" | sed -n '1,35p'
              echo
            } >> recovered/INVENTORY.txt
            {
              echo "================ ${base}.txt ================"
              grep -inE -C 8 'Table 3|Figure 4|Figure 5|Figure 6|Plate 1|test plot.? ?5|test plot.? ?6|TP.?5|TP.?6|cover thickness|95% confidence|mean thickness|range of cover|survey|coordinate|northing|easting|state plane|NAD|station|acre|slope length|as-built|as built|No.? ?3X|Dam 3X|3X Dam|repair|disturb|erosion|inspection|vegetation|seed|top surface|control|uncovered|reclamation status|completed reclamation|future earthwork|regrade' "$txt" || true
              echo
            } >> recovered/TARGETED_EXTRACTS.txt
          done
          find recovered -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort >> recovered/INVENTORY.txt

      - name: Upload recovered records
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-3x-no1-asbuilt-records
          path: recovered/
          if-no-files-found: error
          retention-days: 7
