name: Tyrone depth multi-placement sensitivity

on:
  push:
    branches:
      - agent/tyrone-depth-sensitivity-20260729
    paths:
      - scripts/run_tyrone_multi_placement_sensitivity.py
      - docs/DEPTH_LOCAL_MVP_TYRONE_MULTI_PLACEMENT_SENSITIVITY_PROTOCOL_2026-07-29.md
      - .github/workflows/tyrone-depth-sensitivity.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_tyrone_multi_placement_sensitivity.py
      - docs/DEPTH_LOCAL_MVP_TYRONE_MULTI_PLACEMENT_SENSITIVITY_PROTOCOL_2026-07-29.md
      - .github/workflows/tyrone-depth-sensitivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
      GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
      EE_CREDENTIALS_JSON: ${{ secrets.EE_CREDENTIALS_JSON }}
      GEE_CREDENTIALS_JSON: ${{ secrets.GEE_CREDENTIALS_JSON }}
      EE_PROJECT: ${{ secrets.EE_PROJECT }}
      GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded query dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install earthengine-api pyproj

      - name: Run preregistered sensitivity query
        run: python scripts/run_tyrone_multi_placement_sensitivity.py

      - name: Upload bounded result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-depth-multi-placement-sensitivity
          path: artifacts/tyrone_multi_placement_sensitivity/
          if-no-files-found: error
          retention-days: 7
