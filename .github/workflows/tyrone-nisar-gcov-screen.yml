name: Tyrone NISAR GCOV L-band screen

on:
  push:
    branches:
      - agent/tyrone-nisar-gcov-screen-20260818
    paths:
      - scripts/run_tyrone_nisar_gcov_screen.py
      - .github/workflows/tyrone-nisar-gcov-screen.yml
      - data/tyrone_nisar_gcov_preregistration_2026-08-18.json
      - data/depth_reference/tyrone_3x_six_plot_reference_v1_wgs84.geojson
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_tyrone_nisar_gcov_screen.py
      - .github/workflows/tyrone-nisar-gcov-screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nisar-gcov-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NISAR streaming dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            earthaccess xarray h5netcdf h5py aiohttp numpy shapely pyproj rasterio
      - name: Run frozen Tyrone NISAR GCOV screen
        run: python scripts/run_tyrone_nisar_gcov_screen.py
      - name: Upload NISAR screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-nisar-gcov-screen
          path: artifacts/tyrone_nisar_gcov_screen/
          if-no-files-found: error
          retention-days: 7
