name: Tyrone six-plot terrain screen

on:
  push:
    branches:
      - agent/tyrone-six-plot-terrain-screen-20260818
    paths:
      - scripts/run_tyrone_six_plot_terrain_pc.py
      - docs/TYRONE_SIX_PLOT_TERRAIN_PREREGISTRATION_2026-08-18.md
      - data/tyrone_six_plot_terrain_preregistration_2026-08-18.json
      - data/depth_reference/tyrone_3x_six_plot_reference_v1_wgs84.geojson
      - .github/workflows/tyrone-six-plot-terrain-screen.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_tyrone_six_plot_terrain_pc.py
      - docs/TYRONE_SIX_PLOT_TERRAIN_PREREGISTRATION_2026-08-18.md
      - data/tyrone_six_plot_terrain_preregistration_2026-08-18.json
      - data/depth_reference/tyrone_3x_six_plot_reference_v1_wgs84.geojson
      - .github/workflows/tyrone-six-plot-terrain-screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public terrain screen dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy scipy rasterio shapely pyproj pystac-client planetary-computer
      - name: Run preregistered Tyrone terrain screen
        run: python scripts/run_tyrone_six_plot_terrain_pc.py
      - name: Upload terrain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-six-plot-terrain-pc
          path: artifacts/tyrone_six_plot_terrain_pc/
          if-no-files-found: error
          retention-days: 7
