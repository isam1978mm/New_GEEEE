name: Tyrone TP56 provisional RTC ordering

on:
  push:
    branches:
      - agent/tyrone-tp56-provisional-rtc-20260729
    paths:
      - scripts/run_tyrone_tp56_provisional_pc_rtc.py
      - docs/DEPTH_TYRONE_TP56_PROVISIONAL_RTC_PREREGISTRATION_2026-07-29.md
      - data/tyrone_tp56_provisional_rtc_preregistration_2026-07-29.json
      - .github/workflows/tyrone-tp56-provisional-pc-rtc.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_tyrone_tp56_provisional_pc_rtc.py
      - docs/DEPTH_TYRONE_TP56_PROVISIONAL_RTC_PREREGISTRATION_2026-07-29.md
      - data/tyrone_tp56_provisional_rtc_preregistration_2026-07-29.json
      - .github/workflows/tyrone-tp56-provisional-pc-rtc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordering-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public RTC test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy rasterio shapely pyproj pystac-client planetary-computer

      - name: Run preregistered Tyrone TP5 TP6 ordering test
        run: python scripts/run_tyrone_tp56_provisional_pc_rtc.py

      - name: Upload ordering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-tp56-provisional-pc-rtc
          path: artifacts/tyrone_tp56_provisional_pc_rtc/
          if-no-files-found: error
          retention-days: 7
