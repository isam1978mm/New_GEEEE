name: Tyrone VH relative holdout

on:
  push:
    branches:
      - agent/tyrone-vh-relative-holdout-20260729
    paths:
      - scripts/run_tyrone_vh_relative_holdout.py
      - docs/DEPTH_TYRONE_VH_RELATIVE_HOLDOUT_PREREGISTRATION_2026-07-29.md
      - data/tyrone_vh_relative_holdout_preregistration_2026-07-29.json
      - .github/workflows/tyrone-vh-relative-holdout.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_tyrone_vh_relative_holdout.py
      - docs/DEPTH_TYRONE_VH_RELATIVE_HOLDOUT_PREREGISTRATION_2026-07-29.md
      - data/tyrone_vh_relative_holdout_preregistration_2026-07-29.json
      - .github/workflows/tyrone-vh-relative-holdout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public RTC holdout dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy rasterio shapely pyproj pystac-client planetary-computer

      - name: Run preregistered same-month VH holdout
        run: python scripts/run_tyrone_vh_relative_holdout.py

      - name: Upload holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-vh-relative-holdout
          path: artifacts/tyrone_vh_relative_holdout/
          if-no-files-found: error
          retention-days: 7
