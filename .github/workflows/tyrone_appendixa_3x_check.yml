name: Tyrone Appendix A 3X check

on:
  pull_request:
    paths:
      - scripts/temporary_tyrone_appendixa_3x_check.py
      - .github/workflows/tyrone_appendixa_3x_check.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect official Appendix A
        run: python scripts/temporary_tyrone_appendixa_3x_check.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-appendixa-3x-check
          path: artifacts/tyrone_appendixa_3x_check/result.json
          retention-days: 7
