name: Tyrone NAIP 2004 free check

on:
  pull_request:
    paths:
      - scripts/temporary_tyrone_naip_2004_inventory.py
      - .github/workflows/tyrone_naip_2004_free_check.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Query public EarthExplorer NAIP metadata
        run: python scripts/temporary_tyrone_naip_2004_inventory.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-naip-2004-free-check
          path: artifacts/tyrone_naip_2004_free_check/
          retention-days: 7
