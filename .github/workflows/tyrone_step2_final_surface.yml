name: Tyrone Step 2 final-surface experiment

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/temporary_tyrone_step2_final_surface.py
      - .github/workflows/tyrone_step2_final_surface.yml

permissions:
  contents: read

jobs:
  extract-2018-dem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests rasterio numpy
      - name: Download and crop public USGS 2018 1m DEM
        run: python scripts/temporary_tyrone_step2_final_surface.py
      - name: Upload Step 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-step2-2018-dem
          path: artifacts/tyrone_step2_2018_dem/
          retention-days: 7
