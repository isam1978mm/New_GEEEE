name: Tyrone Step 3 aerial inventory experiment

on:
  push:
    branches:
      - experiment/tyrone-step3-aerial-inventory-20260819
    paths:
      - scripts/temporary_tyrone_step3_aerial_inventory.py
      - .github/workflows/tyrone_step3_aerial_inventory.yml

concurrency:
  group: tyrone-step3-aerial-inventory
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/tyrone-step3-aerial-inventory-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests pyshp
      - name: Query official USGS aerial coverage inventory
        run: python scripts/temporary_tyrone_step3_aerial_inventory.py
      - name: Persist scene list on experiment branch
        shell: bash
        run: |
          cp artifacts/tyrone_step3_aerial_inventory/scene_list.json tmp_tyrone_step3_scene_list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_tyrone_step3_scene_list.json
          git commit -m "Persist temporary Tyrone Step 3 scene list" || exit 0
          git push origin HEAD:experiment/tyrone-step3-aerial-inventory-20260819
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: tyrone-step3-aerial-inventory
          path: artifacts/tyrone_step3_aerial_inventory/
          retention-days: 7
