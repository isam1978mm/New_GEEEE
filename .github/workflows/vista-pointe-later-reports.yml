name: Vista Pointe later-report recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/recover_vista_pointe_later_reports.py"
      - ".github/workflows/vista-pointe-later-reports.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovery dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Recover later Vista Pointe reports
        run: python scripts/recover_vista_pointe_later_reports.py
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-pointe-later-reports
          path: artifacts/vista_pointe_later_reports/
          if-no-files-found: warn
          retention-days: 7
