[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gee-screening-app"
version = "0.1.0"
description = "GEE Screening Web App"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.21.0",
    "earthengine-api>=1.7.24",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pyproj>=3.7.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "docs*", "frontend*", "notebooks*", "alembic*", "scripts*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
